<!DOCTYPE html>
<html>
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="OSR Boss Tracker para seguir respawns y registrar muertes de bosses.">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="OSR Boss Tracker">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>OSR Boss Tracker</title>
  <link rel="manifest" href="manifest.json">
  <style>
    html, body {
      margin: 0;
      padding: 0;
      height: 100%;
      background: #0B0D12;
    }
    #osr-bootstrap-splash {
      position: fixed;
      inset: 0;
      z-index: 999999;
      display: grid;
      place-items: center;
      background: #0B0D12;
      color: #E8E9FF;
      font: 14px system-ui, sans-serif;
      pointer-events: none;
      transition: opacity 0.2s ease-out;
    }
    #osr-bootstrap-splash[hidden] { opacity: 0; }
    .osr-spinner {
      width: 28px;
      height: 28px;
      border: 2px solid #262B48;
      border-top-color: #39FF14;
      border-radius: 50%;
      animation: osr-spin 0.85s linear infinite;
    }
    @keyframes osr-spin { to { transform: rotate(360deg); } }
  </style>
  <script>
    (function () {
      function hideSplash () {
        var el = document.getElementById("osr-bootstrap-splash");
        if (!el) return;
        el.setAttribute("hidden", "");
        setTimeout(function () { try { el.remove(); } catch (e) {} }, 260);
      }
      window.addEventListener("flutter-first-frame", hideSplash);
      setTimeout(hideSplash, 15000);
    })();
  </script>
</head>
<body>
  <div id="osr-bootstrap-splash"><div class="osr-spinner" aria-hidden="true"></div></div>
  <!--
    You can customize the "flutter_bootstrap.js" script.
    This is useful to provide a custom configuration to the Flutter loader
    or to give the user feedback during the initialization process.

    For more details:
    * https://docs.flutter.dev/platform-integration/web/initialization
  -->
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
