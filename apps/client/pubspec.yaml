name: osr_boss_tracker
description: Boss respawn tracker (Android/Web) con Firebase.
publish_to: "none"
version: 0.1.0+1

environment:
  sdk: ">=3.5.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter

  # Firebase
  firebase_core: ^3.15.0
  firebase_auth: ^5.7.0
  cloud_firestore: ^5.6.0
  cloud_functions: ^5.6.2
  firebase_messaging: ^15.2.0
  google_sign_in: ^6.3.0

  # UI / estado / routing
  go_router: ^14.8.0
  intl: ^0.20.2

  # Device/token persistence
  shared_preferences: ^2.3.2
  uuid: ^4.5.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true

flutter_launcher_icons:
  android: true
  image_path_android: assets/branding/logo.png
  adaptive_icon_foreground: assets/branding/logo.png
  adaptive_icon_background: "#0B0D12"
  web:
    generate: true
    image_path: assets/branding/logo.png
    background_color: "#0B0D12"
    theme_color: "#0B0D12"

